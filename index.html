<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      position: relative;
      overflow: hidden;
      color: #ffffff;
    }

    /* Lingkaran Hiasan Latar Belakang (Blur Effect) */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 1;
    }
    body::before {
      width: 300px;
      height: 300px;
      background: rgba(99, 102, 241, 0.4);
      top: 10%;
      left: 15%;
    }
    body::after {
      width: 250px;
      height: 250px;
      background: rgba(236, 72, 153, 0.3);
      bottom: 10%;
      right: 15%;
    }

    /* Kartu Utama dengan Efek Glassmorphism (Blur Card) */
    .glass-card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 400px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .glass-card h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
      background: rgba(255, 255, 255, 0.12);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-logout {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      margin-top: 20px;
    }

    .error-message {
      color: #f87171;
      font-size: 13px;
      margin-top: 14px;
      display: none;
    }

    /* Sembunyikan Dashboard Secara Default */
    #dashboard-sec {
      display: none;
    }
  </style>
</head>
<body>

  <!-- HALAMAN LOGIN -->
  <div id="login-sec" class="glass-card">
    <h2>IELTS PORTAL</h2>
    <p class="subtitle">Masukkan password untuk akses</p>
    
    <form onsubmit="handleLogin(event)">
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">Login</button>
      <div id="errorMsg" class="error-message">Password salah!</div>
    </form>
  </div>

  <!-- HALAMAN DASHBOARD / KONTEN UTAMA -->
  <div id="dashboard-sec" class="glass-card">
    <h2>Selamat Datang!</h2>
    <p class="subtitle">Kamu berhasil login ke IELTS Portal.</p>
    
    <!-- TARUH KONTEN WEBSITE KAMU DI SINI -->
    <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; font-size: 14px;">
      Isi konten, materi, atau link latihan IELTS bisa ditaruh di area ini.
    </div>

    <button onclick="logout()" class="btn btn-logout">Logout</button>
  </div>

  <script>
    // Cek status saat halaman pertama kali dibuka
    if (sessionStorage.getItem("isLoggedIn") === "true") {
      showDashboard();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const inputPass = document.getElementById("password").value;

      // Hash SHA-256 (Aman dari inspect element)
      const encoder = new TextEncoder();
      const data = encoder.encode(inputPass);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      // Hash SHA-256 untuk kata "IELTS"
      const targetHash = "c1257492cfa4d922a94fb2120db0d075ecf556e9dc76e0ffc7e9915998a1bf18";

      if (hashHex === targetHash) {
        sessionStorage.setItem("isLoggedIn", "true");
        showDashboard();
      } else {
        document.getElementById("errorMsg").style.display = "block";
        document.getElementById("password").value = "";
      }
    }

    function showDashboard() {
      document.getElementById("login-sec").style.display = "none";
      document.getElementById("dashboard-sec").style.display = "block";
    }

    function logout() {
      sessionStorage.removeItem("isLoggedIn");
      location.reload();
    }
  </script>

</body>
</html>
